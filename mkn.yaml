#! clean build test run -p test_mod,test -W 9

name: mkn.mod
version: master  # on the latest branch a release, e.g. 0.1.0: merged there it is tagged and published
property:
  # dependency versions, only here: master on master, latest on the latest branch, releases pinned in tags
  mkn.kul.version: master
  parse.yaml.version: master

parent: headers

profile:
- name: headers
  inc: inc
  dep: mkn.kul#${mkn.kul.version} parse.yaml#${parse.yaml.version}[headers]

- name: test_mod
  parent: headers
  src: tst/mod/mod.cpp
  out: test_mod
  mode: shared
  if_arg:
    shared: -DMKN_KUL_SHARED

- name: test
  parent: headers
  test: tst/test.cpp
  if_dep:
    win: parse.yaml#${parse.yaml.version}[lib]
  if_arg:
    win_static: -DYAML_CPP_STATIC_DEFINE

# include-what-you-use report for inc/ and tst/, needs iwyu on PATH
- name: iwyu
  parent: test_mod
  mod:
  - name: cpp.iwyu
    compile:
      paths: inc tst
      headers: -x c++-header
