#! clean build test run -p test_mod,test -W 9

name: mkn.mod

parent: headers

profile:
- name: headers
  inc: inc
  dep: mkn.kul parse.yaml[headers]

- name: test_mod
  parent: headers
  src: tst/mod/mod.cpp
  out: test_mod
  mode: shared
  if_arg:
    shared: -DMKN_KUL_SHARED

- name: test
  parent: headers
  test: tst/test.cpp
  if_dep:
    win: parse.yaml[lib]
  if_arg:
    win_static: -DYAML_CPP_STATIC_DEFINE
